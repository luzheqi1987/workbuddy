<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img">
  <title>MCP 网关数据模型总览</title>
  <desc>五张表的关系：工具与服务一对多，服务引用出网凭证方案，授权表按 sys_code 与服务名授予工具权限，调用日志按同一口径记录；虚线表示逻辑引用，无物理外键。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="30" y="22" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">数据模型总览（Server 容器 → Tool 能力）</text>

  <path d="M150 60 V30 H865 V60" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowP)"/>
  <text x="505" y="48" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">同一取值：INBOUND 行的 sys_code 就是授权主体</text>

  <rect x="30" y="60" width="240" height="155" rx="8" fill="#BA7517" stroke="#BA7517" stroke-width="1"/>
  <rect x="760" y="60" width="210" height="155" rx="8" fill="#534AB7" stroke="#534AB7" stroke-width="1"/>
  <rect x="390" y="250" width="250" height="200" rx="8" fill="#185FA5" stroke="#185FA5" stroke-width="1.2"/>
  <rect x="30" y="430" width="240" height="170" rx="8" fill="#3B6D11" stroke="#3B6D11" stroke-width="1"/>
  <rect x="760" y="430" width="210" height="150" rx="8" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="1"/>

  <path d="M30 92 H270 V207 a8 8 0 0 1 -8 8 H38 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>
  <path d="M760 92 H970 V207 a8 8 0 0 1 -8 8 H768 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>
  <path d="M390 282 H640 V442 a8 8 0 0 1 -8 8 H398 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>
  <path d="M30 462 H270 V592 a8 8 0 0 1 -8 8 H38 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>
  <path d="M760 462 H970 V572 a8 8 0 0 1 -8 8 H768 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>

  <g font-family="Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#ffffff">
    <text x="42" y="80">mcp_gw_auth_scheme</text>
    <text x="772" y="80">mcp_gw_grant</text>
    <text x="402" y="270">mcp_gw_service</text>
    <text x="42" y="450">mcp_gw_tool</text>
    <text x="772" y="450">mcp_gw_call_log</text>
  </g>

  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#333333">
    <text x="42" y="112">id（PK）</text>
    <text x="42" y="131">direction  IN/OUTBOUND</text>
    <text x="42" y="150">sys_code、scheme_key</text>
    <text x="42" y="169">api_in、api_name</text>
    <text x="42" y="188">default_credential 加密</text>

    <text x="772" y="112">id（PK）</text>
    <text x="772" y="131">sys_code + service_id</text>
    <text x="772" y="150">allow_tools[JSON]</text>
    <text x="772" y="169">effect  ALLOW/DENY</text>
    <text x="772" y="188">status、expire_at</text>

    <text x="402" y="302">id（PK）、name（UNIQUE）</text>
    <text x="402" y="321">type、transport、status</text>
    <text x="402" y="340">endpoints[JSON]  后端地址</text>
    <text x="402" y="359">allow_tools[JSON] 工具上限</text>
    <text x="402" y="378">timeout_ms、route_prefix</text>
    <text x="402" y="397">default_upstream_scheme_id</text>
    <text x="402" y="416">version、deleted</text>

    <text x="42" y="482">id（PK）、service_id</text>
    <text x="42" y="501">tool_name、description</text>
    <text x="42" y="520">input_schema[JSON]</text>
    <text x="42" y="539">request/response_template</text>
    <text x="42" y="558">upstream_scheme_id 覆盖</text>
    <text x="42" y="577">enabled、version、deleted</text>

    <text x="772" y="482">id（PK）</text>
    <text x="772" y="501">sys_code、face、route</text>
    <text x="772" y="520">service_id、tool_id</text>
    <text x="772" y="539">耗时、结果码、原因</text>
    <text x="772" y="558">L2 落库，按需开启</text>
  </g>

  <g fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)">
    <path d="M270 480 L330 480 L330 400 L390 400"/>
    <path d="M390 300 L330 300 L330 200 L270 200"/>
    <path d="M830 215 V265 H640"/>
    <path d="M760 500 H570 V450"/>
  </g>

  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">
    <text x="276" y="470">service_id（1 : N）</text>
    <text x="336" y="170">default_upstream_scheme_id</text>
    <text x="336" y="188" fill="#888780">出网凭证来源，工具级可覆盖</text>
    <text x="650" y="284">授权：sys_code × service_id</text>
    <text x="586" y="520">记录 sys_code / service_id / tool_id</text>
  </g>

  <text x="500" y="636" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#888780">虚线＝逻辑引用，无物理外键；一致性由应用层保证（软删 + version 驱动缓存增量刷新）</text>
</svg>
