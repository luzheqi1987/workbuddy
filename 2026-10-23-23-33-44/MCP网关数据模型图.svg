<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img">
  <title>MCP 网关数据模型总览</title>
  <desc>五张表的关系：工具与服务一对多（service_id），服务引用出网凭证方案（default_upstream_scheme_id），授权表按 sys_code 与 service_id 授予工具权限，调用日志按同一口径记录；虚线表示逻辑引用，无物理外键。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text x="30" y="26" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">数据模型总览（Server 容器 → Tool 能力）</text>

  <path d="M155 80 V52 H850 V80" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="502" y="44" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#534AB7">同一取值：INBOUND 行的 sys_code 就是授权主体（两个维度，非引用）</text>

  <rect x="30" y="80" width="250" height="180" rx="8" fill="#BA7517" stroke="#BA7517" stroke-width="1"/>
  <rect x="730" y="80" width="240" height="180" rx="8" fill="#534AB7" stroke="#534AB7" stroke-width="1"/>
  <rect x="380" y="310" width="270" height="230" rx="8" fill="#185FA5" stroke="#185FA5" stroke-width="1.2"/>
  <rect x="30" y="480" width="250" height="200" rx="8" fill="#3B6D11" stroke="#3B6D11" stroke-width="1"/>
  <rect x="730" y="480" width="240" height="170" rx="8" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="1"/>

  <path d="M30 102 H280 V246 a8 8 0 0 1 -8 8 H38 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>
  <path d="M730 102 H970 V246 a8 8 0 0 1 -8 8 H738 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>
  <path d="M380 332 H650 V532 a8 8 0 0 1 -8 8 H388 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>
  <path d="M30 502 H280 V672 a8 8 0 0 1 -8 8 H38 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>
  <path d="M730 502 H970 V642 a8 8 0 0 1 -8 8 H738 a8 8 0 0 1 -8 -8 Z" fill="#ffffff"/>

  <g font-family="Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#ffffff">
    <text x="42" y="100">mcp_gw_auth_scheme</text>
    <text x="742" y="100">mcp_gw_grant</text>
    <text x="392" y="330">mcp_gw_service</text>
    <text x="42" y="500">mcp_gw_tool</text>
    <text x="742" y="500">mcp_gw_call_log</text>
  </g>

  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#333333">
    <text x="42" y="122">id（PK）</text>
    <text x="42" y="141">direction  IN/OUTBOUND</text>
    <text x="42" y="160">sys_code、scheme_key</text>
    <text x="42" y="179">api_in、api_name</text>
    <text x="42" y="198">default_credential 随机串</text>
    <text x="42" y="217">qpm_limit、burst（sys 档）</text>

    <text x="742" y="122">id（PK）</text>
    <text x="742" y="141">sys_code + service_id</text>
    <text x="742" y="160">allow_tools[JSON]</text>
    <text x="742" y="179">effect  ALLOW/DENY</text>
    <text x="742" y="198">status、expire_at</text>

    <text x="392" y="352">id（PK）、name（UNIQUE）</text>
    <text x="392" y="371">type、transport、status</text>
    <text x="392" y="390">endpoints[JSON]  后端地址</text>
    <text x="392" y="409">allow_tools[JSON] 工具上限</text>
    <text x="392" y="428">qpm_limit、burst（tool 档）</text>
    <text x="392" y="447">timeout_ms、route_prefix</text>
    <text x="392" y="466">default_upstream_scheme_id</text>
    <text x="392" y="485">version、deleted</text>

    <text x="42" y="522">id（PK）、service_id</text>
    <text x="42" y="541">tool_name、description</text>
    <text x="42" y="560">input_schema[JSON]</text>
    <text x="42" y="579">request/response_template</text>
    <text x="42" y="598">manual_override 保护改写</text>
    <text x="42" y="617">upstream_scheme_id 覆盖</text>
    <text x="42" y="636">enabled、version、deleted</text>

    <text x="742" y="522">id（PK）</text>
    <text x="742" y="541">sys_code、face、route</text>
    <text x="742" y="560">service_id、tool_id</text>
    <text x="742" y="579">耗时、结果码、原因</text>
    <text x="742" y="598">L2 落库，按需开启</text>
  </g>

  <g fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)">
    <path d="M280 530 H340 V460 H380"/>
    <path d="M380 380 H340 V240 H280"/>
    <path d="M850 260 V340 H650"/>
    <path d="M730 556 H600 V540"/>
  </g>

  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">
    <text x="392" y="558">service_id（1 : N，无外键）</text>
    <text x="286" y="218">default_upstream_scheme_id</text>
    <text x="286" y="234" fill="#888780">出网凭证来源，工具级可覆盖</text>
    <text x="660" y="332">授权：sys_code × service_id</text>
    <text x="616" y="572">记 service_id</text>
    <text x="616" y="588">与 tool_id</text>
  </g>

  <text x="500" y="710" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#888780">虚线＝逻辑引用，无物理外键；一致性由应用层保证（软删 + version 驱动缓存增量刷新）</text>
</svg>
